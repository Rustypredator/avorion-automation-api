; A call spends most of its life waiting on a response file. Sleeping does not count
; against this on Unix, but leave room well past the bridge's own 30s timeout.
max_execution_time = 120

; Requests are capped at 256 KB by the mod and by Caddy; nothing here is large.
memory_limit = 128M
post_max_size = 1M

; Errors belong in the container log, not in a response body that clients parse as the
; API's own JSON error shape.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
