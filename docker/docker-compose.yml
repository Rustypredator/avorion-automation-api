# Everything in this directory is deployment, not mod: the game never loads any of it,
# and it is not part of a Workshop upload.
#
# The mod has no socket - it speaks JSON over files in the galaxy's moddata folder - so
# this runs the bridge that turns HTTP into those files, inside FrankenPHP (Caddy with
# PHP embedded). One container both terminates TLS and writes to the galaxy directory.
#
#   cd docker
#   cp .env.example .env    # point GALAXY_DIR at your galaxy
#   docker compose up -d --build
#   curl -H 'X-API-Key: avo_...' http://localhost/ping

# Otherwise Compose names the project after this directory, i.e. "docker".
name: avorion-automation-api

services:
  api:
    build: ./bridge
    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"

    environment:
      # Defaults to plain HTTP on :80. A hostname here turns on automatic HTTPS.
      API_DOMAIN: "${API_DOMAIN:-:80}"
      # Names and addresses served over HTTPS with a self-signed certificate, on
      # HTTPS_PORT. The console needs HTTPS for browser notifications unless it is opened
      # on localhost - see the Caddyfile and docs/local-testing.md.
      TLS_HOSTS: "${TLS_HOSTS:-localhost}"
      # The certificate presented to a client that names no host, which is any browser
      # opening an IP address. Set it to that IP (which must also be in TLS_HOSTS).
      TLS_DEFAULT_SNI: "${TLS_DEFAULT_SNI:-localhost}"
      GALAXY_DIR: /galaxy
      # Which origins a browser page may call the API from. "*" is the default and is
      # safe here - the key is a header, never a cookie, so a browser sends no
      # credential of its own. Set an origin to narrow it, or "" to send no CORS
      # headers at all (which also blocks the console unless it is loaded from
      # /console/ on this same origin).
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      # The bridge's own history store - see bridge/src/history.php for what it keeps and
      # bridge/src/db.php for the schema. Set HISTORY_DSN to "" to keep no history at all;
      # the bridge then relays every call exactly as before and serves 404 on /history.
      HISTORY_DSN: "${HISTORY_DSN-}"
      # Blank this in .env to keep no history at all - see bridge/src/db.php for why the
      # switch is here and not on HISTORY_DSN.
      HISTORY_DB_HOST: "${HISTORY_DB_HOST-db}"
      HISTORY_DB_NAME: "${POSTGRES_DB:-avorion}"
      HISTORY_DB_USER: "${POSTGRES_USER:-avorion}"
      HISTORY_DB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      HISTORY_DAYS: "${HISTORY_DAYS:-30}"
      # The floor between two stored samples of the same station's books. The mod reads
      # those out of the craft's database row, which the game only rewrites when it saves,
      # so sampling faster than this buys duplicate rows rather than resolution.
      HISTORY_ECONOMY_INTERVAL: "${HISTORY_ECONOMY_INTERVAL:-300}"
      # How long the mod's word on which alliance a key's player is in stays good. Alliance
      # history is shared between members, so a read past this asks the mod again first.
      HISTORY_VERIFY_TTL: "${HISTORY_VERIFY_TTL:-300}"
      # The key the enrolled API keys are encrypted with. Normally left unset: the init
      # service below generates one into the enrol_secret volume and every service that
      # needs it reads it from there, so it never goes near .env. Setting it here
      # overrides the file - do that only if you are managing the secret yourself, and
      # keep it, because changing it makes every existing enrolment unreadable.
      ENROL_SECRET: "${ENROL_SECRET-}"

    # moddata only, so a bridge process that misbehaves still cannot reach saves or the
    # globals file the API keys live in.
    volumes:
      - ./Caddyfile:/etc/frankenphp/Caddyfile:ro
      # The web console, served by the same Caddy at /console/ so the page and the API
      # share an origin and no CORS is involved. Remove this line to not host it.
      - ../web:/app/console:ro
      # The transport directory belongs to the mod, which creates it on startup and
      # re-creates it every 30 seconds if something removes it. So mount the level above
      # it, not the directories themselves.
      #
      # Mounting requests/ and responses/ directly looks tighter and breaks two ways. A
      # bind mount binds an inode, so the moment the mod re-creates a directory the
      # container is left holding the deleted one - it cannot even write to its own mount,
      # and only a down/up recovers. And Docker creates a missing bind-mount source for
      # you, as root, parent levels included: a GALAXY_DIR pointing at the wrong place
      # quietly grows an empty transport directory instead of failing, owned by an account
      # the bridge is probably not running as. moddata/ is the highest level the mod does
      # not manage, so mounting it hands the mod back its own tree.
      #
      # Start the game server before this container, so these exist and belong to it.
      - ${GALAXY_DIR:?set GALAXY_DIR in .env}/moddata:/galaxy/moddata
      - caddy_data:/data
      - caddy_config:/config
      # Read-only here: the bridge uses the secret, the init service makes it.
      - enrol_secret:/run/enrol:ro

    # Root writes request files the game server can still read and delete. Set
    # BRIDGE_USER to the game account's uid:gid to have it own them instead; the init
    # service below hands it the caddy volumes so this stays the only knob to set.
    user: "${BRIDGE_USER:-root}"

    depends_on:
      init:
        condition: service_completed_successfully
      # Not service_started: the schema is created on the first connection, and Postgres
      # refuses connections for a second or two after the process appears. Without the
      # healthcheck the first few relayed calls would log a history write failure each.
      db:
        condition: service_healthy

    healthcheck:
      # Unauthenticated, so a healthy bridge answers 401 - which is proof enough that
      # Caddy, PHP and the route are all up.
      test: ["CMD", "sh", "-c", "wget -qS -O /dev/null http://127.0.0.1:80/ping 2>&1 | grep -q ' 401 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Where ship movement and events are kept. On its own volume rather than anywhere under
  # the galaxy: that tree belongs to the mod, which re-creates its own directories on a
  # timer, and this data outlives any one galaxy restart. Delete the volume to throw the
  # history away.
  #
  # Not published to a host port. Nothing outside this stack has any business reaching it,
  # and the bridge is the only thing that knows the schema.
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-avorion}"
      POSTGRES_USER: "${POSTGRES_USER:-avorion}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      # The bridge stores no free text from players as an identifier - craft names are
      # values, never table or column names - but the galaxy is full of non-ASCII ship
      # names, so the database is created as UTF-8 rather than the image's locale default.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    volumes:
      - history:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avorion} -d ${POSTGRES_DB:-avorion}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Keeps something calling the API, so the history has no holes in it.
  #
  # The mod never pushes: movement is only recorded when someone asks for /ships, and the
  # mod's own event log is a 200-entry ring buffer that drops the oldest entry whether or
  # not anyone collected it. Without this service the record is a record of when a browser
  # tab happened to be open. See bridge/src/poll.php.
  #
  # It calls the api service over HTTP like any other client rather than writing to the
  # database itself, so there is one recording code path and the mod still authenticates
  # every key.
  #
  # Whose fleets it records is not set here. Players enrol their own key from the
  # console's Keys tab and this reads the table every pass, so nobody has to edit a file
  # or restart anything - see bridge/src/enrolment.php. With nobody enrolled it idles and
  # says so, which is why it stays up rather than exiting.
  poller:
    build: ./bridge
    restart: unless-stopped
    entrypoint: ["php", "/app/src/poll.php"]

    environment:
      POLL_URL: "http://api:80"
      # Deprecated, and empty in a fresh deployment. Anything still listed here is moved
      # into the database once on startup so an upgrade does not stop recording; take it
      # out of .env afterwards.
      POLL_KEYS: "${POLL_KEYS-}"
      POLL_INTERVAL: "${POLL_INTERVAL:-30}"
      POLL_EVENTS: "${POLL_EVENTS:-1}"
      POLL_ECONOMY: "${POLL_ECONOMY:-1}"
      HISTORY_DSN: "${HISTORY_DSN-}"
      # Blank this in .env to keep no history at all - see bridge/src/db.php for why the
      # switch is here and not on HISTORY_DSN.
      HISTORY_DB_HOST: "${HISTORY_DB_HOST-db}"
      HISTORY_DB_NAME: "${POSTGRES_DB:-avorion}"
      HISTORY_DB_USER: "${POSTGRES_USER:-avorion}"
      HISTORY_DB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      HISTORY_DAYS: "${HISTORY_DAYS:-30}"
      HISTORY_ECONOMY_INTERVAL: "${HISTORY_ECONOMY_INTERVAL:-300}"
      ENROL_SECRET: "${ENROL_SECRET-}"

    volumes:
      - enrol_secret:/run/enrol:ro

    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy

    # It sleeps between passes and cannot be woken early - pcntl is not in the image - so
    # a long grace period just makes every restart slow. Nothing is lost: each pass has
    # committed before the sleep begins.
    stop_grace_period: 5s

  # Turns what the poller collected into messages on somebody's phone.
  #
  # The console's browser notifications only reach a tab that is open on a machine that is
  # awake, which is exactly not the case when a fleet is grinding overnight. This watches
  # the events the poller is already recording, decides what crossed a line a player asked
  # about, and pushes it through ntfy, Gotify or a webhook. See bridge/src/notify.php.
  #
  # It needs the poller: almost everything it reads comes out of the same tables, and one
  # live call per key per pass for the craft listing. Whose rules it runs comes from the
  # same enrolment table the poller reads, and a player opts in to the two separately -
  # recording a fleet and being messaged about it are different things to want.
  notifier:
    build: ./bridge
    restart: unless-stopped
    entrypoint: ["php", "/app/src/notify.php"]

    environment:
      NOTIFY_URL: "http://api:80"
      # Both deprecated, like POLL_KEYS above: imported once on startup, then ignored.
      # POLL_KEYS is here because NOTIFY_KEYS used to fall back to it, so a deployment
      # that only ever set the one still gets its alerts carried over.
      NOTIFY_KEYS: "${NOTIFY_KEYS-}"
      POLL_KEYS: "${POLL_KEYS-}"
      NOTIFY_INTERVAL: "${NOTIFY_INTERVAL:-15}"
      HISTORY_DSN: "${HISTORY_DSN-}"
      HISTORY_DB_HOST: "${HISTORY_DB_HOST-db}"
      HISTORY_DB_NAME: "${POSTGRES_DB:-avorion}"
      HISTORY_DB_USER: "${POSTGRES_USER:-avorion}"
      HISTORY_DB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      HISTORY_VERIFY_TTL: "${HISTORY_VERIFY_TTL:-300}"
      ENROL_SECRET: "${ENROL_SECRET-}"

    volumes:
      - enrol_secret:/run/enrol:ro

    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy

    # Same as the poller: it sleeps between passes and cannot be woken early.
    stop_grace_period: 5s

  # Docker creates a named volume owned by root, so with BRIDGE_USER set the API cannot
  # write /data - and Caddy needs it on startup even in plain-HTTP mode, because
  # skip_install_trust makes it provision the local CA whether or not TLS is served.
  # Failing that mkdir aborts the whole config load, so the container never comes up.
  #
  # It also generates the enrolment secret, which is the key the players' API keys are
  # encrypted with in the database (see bridge/src/enrolment.php). Doing it here rather
  # than in .env means the secret exists without anybody having to choose one, and that
  # it is not sitting in a file next to the compose project. It is written once and then
  # left alone: regenerating it would make every existing enrolment unreadable, so back
  # the enrol_secret volume up alongside the database.
  #
  # This runs as root just long enough to hand the volumes over, then exits. It uses
  # the image the bridge is built from, which is already pulled, rather than adding one.
  init:
    image: dunglas/frankenphp:1-php8.3-alpine
    user: root
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /run/enrol/secret ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/enrol/secret
        fi
        chmod 0640 /run/enrol/secret
        chown -R "$${BRIDGE_USER:-root}" /data /config /run/enrol
    environment:
      BRIDGE_USER: "${BRIDGE_USER:-root}"
    restart: "no"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - enrol_secret:/run/enrol

volumes:
  caddy_data:
  caddy_config:
  # The key the enrolled API keys in the database are encrypted with, generated by the
  # init service. Worth exactly the same backup as the database volume: without it the
  # enrolled keys cannot be read and every player has to enrol again.
  enrol_secret:
  # The Postgres data directory. Postgres manages its own ownership inside the volume, so
  # unlike the caddy volumes this one needs nothing from the init service.
  history:
